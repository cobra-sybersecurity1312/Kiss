<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بوسة ليكي 💋</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ffd9e0; --bg2:#ffb3c4; --bg3:#ff8fa9; --ink:#4a0d1f; --soft:#7a2f45; --lip1:#ff5c80; --lip2:#c8153f; --heart:#e0284f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg1:#4a0f25; --bg2:#2d0816; --bg3:#17030b; --ink:#ffe6ec; --soft:#e9a9b8; --lip1:#ff6a8c; --lip2:#d11c4a; --heart:#ff5c80;}
}
:root[data-theme="dark"]{--bg1:#4a0f25; --bg2:#2d0816; --bg3:#17030b; --ink:#ffe6ec; --soft:#e9a9b8; --lip1:#ff6a8c; --lip2:#d11c4a; --heart:#ff5c80;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 35%,var(--bg1),var(--bg2) 55%,var(--bg3));color:var(--ink);
  font-family:"Tajawal",sans-serif;overflow:hidden;text-align:center;-webkit-tap-highlight-color:transparent;user-select:none}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#bg i{position:absolute;bottom:-60px;font-style:normal;color:var(--heart);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) translateX(0) rotate(0);opacity:0}10%{opacity:var(--o)}
  50%{transform:translateY(-55vh) translateX(var(--dx)) rotate(14deg)}
  100%{transform:translateY(-115vh) translateX(calc(var(--dx)*-1)) rotate(-12deg);opacity:0}}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
main{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:6px}
h1{font-family:"Aref Ruqaa",serif;font-weight:700;font-size:clamp(2.3rem,9vw,4rem);margin:0 0 4px;line-height:1.4;
  text-shadow:0 4px 24px color-mix(in srgb,var(--heart) 40%,transparent)}
h1 span{display:inline-block;opacity:0;filter:blur(12px);transform:translateY(18px);animation:word 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes word{to{opacity:1;filter:blur(0);transform:none}}
#msg{margin:0;min-height:3.4em;max-width:420px;color:var(--soft);font-size:1.15rem;line-height:1.7;opacity:0;animation:fade 1s 1.6s forwards}
@keyframes fade{to{opacity:1}}
#stage{position:relative;width:min(300px,78vw);margin:18px 0 8px;opacity:0;animation:fade 1s 1.1s forwards}
#stage::before,#stage::after{content:"";position:absolute;inset:-14%;border-radius:50%;border:2px solid var(--heart);opacity:0;pointer-events:none}
#stage.go::before{animation:ring .9s ease-out}
#stage.go::after{animation:ring .9s .15s ease-out}
@keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.5);opacity:0}}
#glow{position:absolute;inset:-10% -10%;background:radial-gradient(circle,color-mix(in srgb,var(--heart) 55%,transparent),transparent 65%);filter:blur(24px);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.9);opacity:.6}50%{transform:scale(1.1);opacity:1}}
#lips{position:relative;display:block;width:100%;background:none;border:0;padding:0;cursor:pointer;
  filter:drop-shadow(0 14px 22px color-mix(in srgb,var(--lip2) 55%,transparent));animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
#lips:focus-visible{outline:3px solid var(--ink);outline-offset:10px;border-radius:24px}
#lips svg{display:block;width:100%;height:auto;overflow:visible}
.hint{color:var(--soft);font-size:.95rem;opacity:0;animation:fade 1s 2.2s forwards,nudge 2s 3s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.count{margin-top:6px;color:var(--soft);font-size:1rem}
.count b{font-family:"Aref Ruqaa",serif;font-size:2rem;color:var(--heart);display:inline-block}
.count b.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.5)}}
.fly{position:fixed;z-index:4;width:64px;pointer-events:none;left:0;top:0}
#snd{position:fixed;z-index:6;top:calc(env(safe-area-inset-top,0px) + 14px);inset-inline-start:14px;width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;font-size:20px;background:color-mix(in srgb,var(--heart) 22%,transparent);color:var(--ink)}
#snd:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){#bg,#glow,#lips,.hint{animation:none}h1 span,#msg,#stage,.hint{animation-duration:.01s;animation-delay:0s}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<canvas id="cv" aria-hidden="true"></canvas>
<button id="snd" aria-label="كتم الصوت">🔊</button>
<main>
  <h1><span style="animation-delay:.1s">يا</span> <span style="animation-delay:.3s">أحلى</span> <span style="animation-delay:.5s">حاجة</span> <span style="animation-delay:.7s">في</span> <span style="animation-delay:.9s">حياتي</span></h1>
  <p id="msg">عندي ليكي بوسة… دوسي على الشفايف</p>
  <div id="stage">
    <div id="glow"></div>
    <button id="lips" aria-label="ابعتي بوسة">
      <svg viewBox="0 0 200 124" id="lipsvg">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--lip1)"/><stop offset="1" stop-color="var(--lip2)"/></linearGradient>
        </defs>
        <g id="lipg" style="transform-origin:100px 62px;transform-box:view-box">
          <path d="M8 64C38 50 68 24 100 42C132 24 162 50 192 64C160 76 130 77 100 77C70 77 40 76 8 64Z" fill="url(#g)"/>
          <path d="M8 64C40 76 70 77 100 77C130 77 160 76 192 64C172 104 136 118 100 118C64 118 28 104 8 64Z" fill="url(#g)" opacity=".92"/>
          <path d="M8 64C50 78 150 78 192 64" fill="none" stroke="rgba(60,0,20,.45)" stroke-width="2.2" stroke-linecap="round"/>
          <ellipse cx="100" cy="98" rx="30" ry="8" fill="#fff" opacity=".28"/>
          <path d="M72 40C84 36 92 40 100 44" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".3"/>
        </g>
      </svg>
    </button>
  </div>
  <div class="hint" id="hint">دوسي على الشفايف 👆</div>
  <div class="count">عدد البوسات: <b id="n">٠</b></div>
</main>
<script>
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
const msgs=["مواااه 💋 دي أول بوسة ليكي","وحشتيني أكتر من إمبارح","بوسة كمان عشان عيونك الحلوين","إنتي أحلى صدفة حصلت في حياتي","ضحكتك دي بتصلّح يومي كله","بحبك بجد، مش بهزر","كفاية كده؟ لا لا، كمان!","إنتي بيتي وأماني","وانتي جنبي الدنيا حلوة","مواااه… ودي من القلب"];
const ar=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const $=id=>document.getElementById(id);

/* floating hearts background */
if(!reduce){
  const bg=$("bg"),hs=["❤","♥","💗","💕"];
  for(let i=0;i<18;i++){
    const e=document.createElement("i");
    e.textContent=hs[i%4];
    const s=12+Math.random()*34;
    e.style.cssText=`left:${Math.random()*100}%;font-size:${s}px;--o:${.15+Math.random()*.35};--dx:${(Math.random()*60-30)}px;`+
      `animation-duration:${9+Math.random()*10}s;animation-delay:${-Math.random()*14}s;filter:blur(${s<20?1.5:0}px)`;
    bg.appendChild(e);
  }
}

/* canvas heart particles */
const cv=$("cv"),ctx=cv.getContext("2d");let P=[],raf=0,DPR=Math.min(devicePixelRatio||1,2);
function size(){cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;}
size();addEventListener("resize",size);
const cols=["#ff5c80","#ff8fa9","#ffc2d0","#e0284f","#ffd6a5"];
function heart(x,y,s,r,c,a){
  ctx.save();ctx.translate(x,y);ctx.rotate(r);ctx.scale(s,s);ctx.globalAlpha=a;ctx.fillStyle=c;
  ctx.beginPath();ctx.moveTo(0,.35);ctx.bezierCurveTo(-1,-.5,-1.7,.5,0,1.5);ctx.bezierCurveTo(1.7,.5,1,-.5,0,.35);ctx.fill();ctx.restore();
}
function burst(x,y,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,v=(3+Math.random()*7)*DPR;
    P.push({x:x*DPR,y:y*DPR,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4*DPR,s:(6+Math.random()*12)*DPR,r:Math.random()*6,vr:(Math.random()-.5)*.2,c:cols[i%5],l:1});
  }
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  ctx.clearRect(0,0,cv.width,cv.height);
  P=P.filter(p=>p.l>0);
  for(const p of P){
    p.vy+=.22*DPR;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l-=.011;
    heart(p.x,p.y,p.s/1.6,p.r,p.c,Math.max(p.l,0));
  }
  raf=P.length?requestAnimationFrame(tick):0;
  if(!raf)ctx.clearRect(0,0,cv.width,cv.height);
}

/* flying kiss */
const kissSVG=`<svg viewBox="0 0 200 124" style="width:100%;display:block"><path d="M8 64C38 50 68 24 100 42C132 24 162 50 192 64C160 76 130 77 100 77C70 77 40 76 8 64Z" fill="#e0284f"/><path d="M8 64C40 76 70 77 100 77C130 77 160 76 192 64C172 104 136 118 100 118C64 118 28 104 8 64Z" fill="#c8153f"/></svg>`;
function fly(from){
  const e=document.createElement("div");e.className="fly";e.innerHTML=kissSVG;document.body.appendChild(e);
  const tx=innerWidth*(.12+Math.random()*.76),ty=innerHeight*(.1+Math.random()*.6),rot=Math.random()*70-35;
  const dx=from.x-32,dy=from.y-20;
  const a=e.animate([
    {transform:`translate(${dx}px,${dy}px) scale(.5) rotate(0deg)`,opacity:0},
    {transform:`translate(${dx}px,${dy}px) scale(.8) rotate(0deg)`,opacity:1,offset:.12},
    {transform:`translate(${tx-32}px,${ty-20}px) scale(1.5) rotate(${rot}deg)`,opacity:1,offset:.6},
    {transform:`translate(${tx-32}px,${ty-30}px) scale(1.3) rotate(${rot}deg)`,opacity:0}
  ],{duration:reduce?300:1900,easing:"cubic-bezier(.2,.7,.3,1)"});
  a.onfinish=()=>e.remove();
  setTimeout(()=>burst(tx,ty,10),reduce?0:1100);
}

/* typewriter */
let tw=0;
function type(t){
  clearInterval(tw);const m=$("msg");m.textContent="";let i=0;
  tw=setInterval(()=>{m.textContent=t.slice(0,++i);if(i>=t.length)clearInterval(tw)},reduce?0:38);
}

/* kiss sound (synthesized, no files needed) */
let ac=null,muted=false;
function kissSound(){
  if(muted)return;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{
    ac=ac||new AC();if(ac.state==="suspended")ac.resume();
    const t=ac.currentTime,k=.92+Math.random()*.2;
    const env=(g,a,pk,end)=>{g.gain.setValueAtTime(.0001,t+a);g.gain.exponentialRampToValueAtTime(pk,t+a+.02);g.gain.exponentialRampToValueAtTime(.0001,t+end)};
    /* soft pucker */
    const o1=ac.createOscillator(),g1=ac.createGain();o1.type="sine";
    o1.frequency.setValueAtTime(200*k,t);o1.frequency.exponentialRampToValueAtTime(340*k,t+.13);
    env(g1,0,.18,.15);o1.connect(g1).connect(ac.destination);o1.start(t);o1.stop(t+.2);
    /* the pop */
    const o2=ac.createOscillator(),g2=ac.createGain();o2.type="sine";
    o2.frequency.setValueAtTime(1200*k,t+.13);o2.frequency.exponentialRampToValueAtTime(260*k,t+.23);
    env(g2,.13,.55,.25);o2.connect(g2).connect(ac.destination);o2.start(t+.13);o2.stop(t+.3);
    /* wet smack noise */
    const len=Math.floor(ac.sampleRate*.09),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
    const ns=ac.createBufferSource(),bp=ac.createBiquadFilter(),g3=ac.createGain();
    ns.buffer=buf;bp.type="bandpass";bp.frequency.value=2600*k;bp.Q.value=1.1;g3.gain.value=.45;
    ns.connect(bp).connect(g3).connect(ac.destination);ns.start(t+.13);
  }catch(e){}
}
$("snd").addEventListener("click",e=>{
  muted=!muted;e.currentTarget.textContent=muted?"🔇":"🔊";
  e.currentTarget.setAttribute("aria-label",muted?"شغّلي الصوت":"كتم الصوت");
});

/* tap */
let n=0;const lipg=$("lipg"),stage=$("stage");
$("lips").addEventListener("click",()=>{
  n++;
  const c=$("n");c.textContent=ar(n);c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop");
  $("hint").style.display="none";
  type(msgs[(n-1)%msgs.length]);
  const r=lipg.getBoundingClientRect(),ctr={x:r.left+r.width/2,y:r.top+r.height/2};
  if(!reduce){
    lipg.animate([{transform:"scale(1,1)"},{transform:"scale(.72,1.18)",offset:.25},{transform:"scale(1.12,.9)",offset:.55},{transform:"scale(1,1)"}],{duration:520,easing:"ease-out"});
    stage.classList.remove("go");void stage.offsetWidth;stage.classList.add("go");
  }
  kissSound();
  burst(ctr.x,ctr.y,26);
  fly(ctr);
  if(navigator.vibrate)try{navigator.vibrate(35)}catch(e){}
});
</script>
</body>
</html>
